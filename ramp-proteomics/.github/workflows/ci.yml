name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest

  frozen-regression:
    runs-on: macos-15
    env:
      RAMP_REQUIRE_FROZEN_LOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.1"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r reproducibility/requirements-paper.txt
      - run: python -m pip install -e '.[test]' -c reproducibility/requirements-paper.txt
      - run: python -m pip check
      - run: python -m pytest

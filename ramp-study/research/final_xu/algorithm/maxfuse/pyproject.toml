[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-maxfuse-repro"
version = "1.2.0"
description = "Internal academic reproducibility driver for external MaxFuse"
requires-python = ">=3.12"
dependencies = [
  "maxfuse==0.0.2",
  "anndata==0.11.4",
  "zarr==2.18.7",
  "scanpy==1.12.4",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "scikit-learn==1.9.0",
  "igraph==1.0.0",
  "leidenalg==0.12.0",
  "matplotlib==3.11.1",
  "requests==2.34.2",
  "networkx==3.6.1",
  "numba==0.67.0",
  "llvmlite==0.49.0",
  "pynndescent==0.6.0",
  "joblib==1.5.3",
  "threadpoolctl==3.6.0",
]

[project.scripts]
ramp-maxfuse-pairwise = "run_maxfuse_pairwise:main"
ramp-maxfuse-threeway = "run_maxfuse_threeway:main"
ramp-maxfuse-three-view-extension = "run_maxfuse_three_view_extension:main"

[tool.setuptools]
py-modules = [
  "run_maxfuse_pairwise",
  "run_maxfuse_threeway",
  "run_maxfuse_three_view_extension",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maxfuse_repro*"]

[tool.setuptools.package-data]
maxfuse_repro = [
  "upstream_lock.json",
  "requirements-lock.txt",
  "environment-lock.txt",
]
